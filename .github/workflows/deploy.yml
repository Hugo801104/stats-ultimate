# Déploiement automatique sur GitHub Pages à chaque push sur « main ».
# Prérequis (une seule fois) : dépôt GitHub → Settings → Pages → Source : « GitHub Actions ».
#
# Sécurité de la chaîne :
#  - actions épinglées sur une empreinte de commit (une étiquette de version peut être déplacée,
#    pas une empreinte) ; Dependabot les met à jour chaque semaine ;
#  - droits minimaux, accordés job par job ;
#  - installation sans exécuter les scripts des paquets (--ignore-scripts) ;
#  - publication bloquée si une dépendance de l'appli a une faille connue grave.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Bloque la publication si une dépendance livrée aux visiteurs a une faille élevée ou critique.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      # Vérifie les types puis construit dist/ (avec le service worker hors-ligne).
      # Les valeurs Supabase ne sont PAS dans le dépôt : elles viennent des secrets GitHub
      # (Settings → Secrets and variables → Actions).
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          # Nécessaire pour publier .well-known/security.txt (exclu par défaut).
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
