<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      Politique de sécurité (CSP) : seuls les scripts du site s'exécutent, et l'appli ne peut
      contacter que son propre domaine, le projet Supabase et l'API météo. Un script injecté
      ne pourrait donc ni s'exécuter ni envoyer la session ailleurs.
      %VITE_SUPABASE_URL% est remplacé au build par l'adresse du projet.
      (GitHub Pages ne permet pas d'en-têtes HTTP : la protection anti-iframe est faite en JS, voir main.ts.)
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' %VITE_SUPABASE_URL% https://api.open-meteo.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b6e69" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>Stats Ultimate · Les Plouf</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Cette application nécessite JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
